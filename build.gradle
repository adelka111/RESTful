plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'utb.fai'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
    // Jádro pro REST API (obsahuje webový server Tomcat a podporu pro JSON)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Práce s databází přes anotace @Entity a repozitáře (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validace vstupních dat (@NotBlank, @Email, @Pattern, @Valid ...)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JDBC ovladač pro PostgreSQL (Aiven) – používá se pouze při běhu aplikace
	runtimeOnly 'org.postgresql:postgresql'
    // Pro MySQL na Aivenu místo toho odkomentujte:
	// runtimeOnly 'com.mysql:mysql-connector-j'

    // Standardní nástroje pro testování
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
